# Nginx configuration for College Football Swiss
# This file is a template - the deploy.sh script will customize it

server {
    listen 80;
    listen [::]:80;

    # Replace with your domain or use '_' for IP-only access
    server_name your-domain.com;

    # Path to web files
    root /var/www/college-football-swiss;
    index index.html;

    # Logging
    access_log /var/log/nginx/college-football-swiss_access.log;
    error_log /var/log/nginx/college-football-swiss_error.log;

    # Main location
    location / {
        try_files $uri $uri/ =404;
    }

    # GeoJSON files - set proper MIME type and CORS
    location ~* \.geojson$ {
        add_header Content-Type application/json;
        add_header Access-Control-Allow-Origin *;
    }

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
}

